name: Build and Deploy to ECR

on:
  push:
    branches: [ docker ]
  pull_request:
    branches: [ docker ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/q4a0k8k4
  ECR_REPOSITORY: java-crud-app

jobs:
  filter-changes:
    runs-on: ubuntu-latest
    outputs:
      docker-changed: ${{ steps.filter.outputs.docker-changed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 2  # Ensure we have the previous commit to diff against

    - name: Detect changes in Docker-related files
      id: filter
      run: |
        git diff --name-only HEAD^ HEAD > changed_files.txt
        cat changed_files.txt

        if grep -qE '(^Dockerfile|docker-compose.*\.yml|\.dockerignore|^src/)' changed_files.txt; then
          echo "docker-changed=true" >> $GITHUB_OUTPUT
        else
          echo "docker-changed=false" >> $GITHUB_OUTPUT
        fi

  build-and-push:
    name: Build and Push to ECR
    needs: [filter-changes]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check if docker-related files changed
      id: skip-check
      run: echo "skip_build=${{ needs.filter-changes.outputs.docker-changed != 'true' }}" >> $GITHUB_OUTPUT

    - name: Skip build step (no changes detected)
      if: steps.skip-check.outputs.skip_build == 'true'
      run: echo "No relevant Docker changes. Skipping build and push."

    - name: Configure AWS credentials
      if: steps.skip-check.outputs.skip_build != 'true'
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      if: steps.skip-check.outputs.skip_build != 'true'
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v1
      with:
        registry-type: public

    - name: Build, tag, and push image to Amazon ECR
      if: steps.skip-check.outputs.skip_build != 'true'
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to Private EC2 via Bastion
    runs-on: ubuntu-latest
    needs: [filter-changes, build-and-push]

    steps:
    - name: Set up SSH key for Bastion
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/bastion.pem
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/target.pem
        chmod 600 ~/.ssh/*.pem

        # SSH config with ProxyJump through bastion
        cat <<EOF > ~/.ssh/config
        Host bastion
          HostName ${{ secrets.BASTION_HOST }}
          User ec2-user
          IdentityFile ~/.ssh/bastion.pem
          StrictHostKeyChecking no

        Host target
          HostName ${{ secrets.PRIVATE_EC2_HOST }}
          User ec2-user
          IdentityFile ~/.ssh/target.pem
          ProxyJump bastion
          StrictHostKeyChecking no
        EOF

    - name: Deploy using SSH via Bastion
      run: |
        ssh target << 'EOF'
          echo "Cloning latest repo..."
          cd /home/ec2-user
          if [ -d java-crud-app ]; then
            cd java-crud-app && git checkout docker && git pull origin docker
          else
            git clone --branch docker https://github.com/${{ github.repository }}.git java-crud-app && cd java-crud-app
          fi

          echo "Setting environment variables for Docker Compose..."
          echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}" > .env
          echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}" >> .env
          echo "IMAGE_TAG=latest" >> .env

          echo "Pulling latest images via Docker Compose..."
          docker-compose -f docker-compose.prod.yml pull

          echo "Restarting application with Docker Compose..."
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans
        EOF
