name: Build and Deploy to ECR

on:
  push:
    branches: [ docker ]
  pull_request:
    branches: [ docker ]



env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/q4a0k8k4
  ECR_REPOSITORY: java-crud-app

jobs:


  filter-changes:
    runs-on: ubuntu-latest
    outputs:
      docker-changed: ${{ steps.filter.outputs.docker }}
    steps:
    - uses: actions/checkout@v3

    - name: Filter for Docker-related changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          docker:
            - 'Dockerfile'
            - 'docker-compose.prod.yml'
            - 'src/**'

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      ecr-registry: ${{ steps.login-ecr-public.outputs.registry }}
    if: needs.filter-changes.outputs.docker-changed == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # - name: Set up JDK 11
    #   uses: actions/setup-java@v3
    #   with:
    #     java-version: '11'
    #     distribution: 'temurin'

    # - name: Cache Maven packages
    #   uses: actions/cache@v3
    #   with:
    #     path: ~/.m2
    #     key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
    #     restore-keys: ${{ runner.os }}-m2

    # - name: Build with Maven
    #   run: mvn clean package -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v1
      with:
        registry-type: public


    - name: Build, tag, and push image to Amazon ECR
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to EC2 with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/docker'

    steps:
    - name: Deploy using SSH and Docker Compose
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "Cloning latest repo..."
          cd /home/ec2-user
          if [ -d java-crud-app ]; then
            cd java-crud-app && git checkout docker && git pull origin docker
          else
            git clone --branch docker https://github.com/${{ github.repository }}.git java-crud-app && cd java-crud-app
          fi
          
          echo "Setting environment variables for Docker Compose..."
          echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}" > .env
          echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env

          echo "Pulling latest images via Docker Compose..."
          docker-compose -f docker-compose.prod.yml pull

          echo "Restarting application with Docker Compose..."
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans
