name: CI/CD Pipeline

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Run tests
      run: mvn clean test
    - name: Build application
      id: build
      run: |
        mvn package -DskipTests
        echo "artifact-name=java-crud-app-1.0.0.jar" >> $GITHUB_OUTPUT
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 1

  deploy-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
    - name: Deploy to Dev
      run: |
        echo "Deploying to DEV environment"
        echo "DB_URL=jdbc:postgresql://${{ secrets.DEV_DB_HOST }}:5432/webapp"

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: test
    steps:
    - uses: actions/checkout@v3
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/
    - name: Deploy and run on Test Host
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          echo "export SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.TEST_DB_HOST }}:5432/webapp" > /home/ec2-user/app/env.sh
          echo "export SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" >> /home/ec2-user/app/env.sh
          echo "export SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /home/ec2-user/app/env.sh
          echo "export SPRING_PROFILES_ACTIVE=test" >> /home/ec2-user/app/env.sh
    - name: Upload and start app
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "target/*.jar,run.sh"
        target: "/home/ec2-user/app/"
        post_script: |
          chmod +x /home/ec2-user/app/run.sh
          pkill -f java-crud-app || true
          cd /home/ec2-user/app && source env.sh && nohup java -jar target/java-crud-app-1.0.0.jar > app.log 2>&1 &

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: staging
    steps:
    - uses: actions/checkout@v3
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/
    - name: Deploy and run on Staging Host
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/ec2-user/app
          echo "export SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.STG_DB_HOST }}:5432/webapp" > /home/ec2-user/app/env.sh
          echo "export SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" >> /home/ec2-user/app/env.sh
          echo "export SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /home/ec2-user/app/env.sh
          echo "export SPRING_PROFILES_ACTIVE=staging" >> /home/ec2-user/app/env.sh
    - name: Upload and start app
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "target/*.jar,run.sh"
        target: "/home/ec2-user/app/"
        post_script: |
          chmod +x /home/ec2-user/app/run.sh
          pkill -f java-crud-app || true
          cd /home/ec2-user/app && source env.sh && nohup java -jar target/java-crud-app-1.0.0.jar > app.log 2>&1 &