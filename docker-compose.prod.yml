version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres-db-prod
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: ChangeMe123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  java-app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: java-crud-app-prod
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webapp
      DB_USERNAME: dbadmin
      DB_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge